<!-- =========================================================================
     CAMPUSFLOW PAGE COMPONENT: Job Completion & Evidence Submission
     ID: view-worker-complete
     Location: frontend/src/pages/worker/job-complete.html
     ========================================================================= -->

<div id="view-worker-complete" class="auth-view hidden">
  <div class="max-w-2xl mx-auto">
    <div class="mb-6">
      <button onclick="navigateTo('worker-active', 'worker')" class="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-900 mb-2">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Back to Active Job</span>
      </button>
      <h1 class="text-2xl font-bold text-slate-900">Submit Job Completion</h1>
      <p class="text-xs text-slate-600">Upload photographic proof and close work order CF-2026-00124</p>
    </div>

    <form onsubmit="handleWorkerCompleteSubmit(event)" class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-5 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 uppercase mb-1">Resolution Summary <span class="text-red-500">*</span></label>
        <textarea id="complete-notes" required rows="3" placeholder="e.g. Replaced faulty 16A circuit breaker #4, cleaned carbon deposits, tested circuit under 2.2kW load. Zero voltage drop observed." class="w-full p-3 border border-slate-300 rounded-lg text-sm"></textarea>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 uppercase mb-1">Geostamped Photo Proof <span class="text-red-500">*</span></label>
        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-slate-400 transition-colors cursor-pointer" onclick="document.getElementById('file-upload-worker').click()">
          <input type="file" id="file-upload-worker" class="hidden" onchange="handleWorkerPhotoSelect(this)"/>
          <span class="material-symbols-outlined text-[32px] text-emerald-600">add_a_photo</span>
          <p class="text-xs font-semibold text-slate-700 mt-2">Take or upload completion photo</p>
          <p class="text-[11px] text-slate-400">Timestamp and room tag will be watermarked</p>
        </div>
        <div id="worker-photo-preview" class="hidden mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded-lg text-xs font-mono text-emerald-800 flex items-center justify-between">
          <span>repaired_switchboard_proof.jpg (Watermarked)</span>
          <span class="text-emerald-600 font-bold">READY</span>
        </div>
      </div>

      <label class="flex items-start gap-2 pt-2 cursor-pointer">
        <input type="checkbox" required class="rounded border-slate-300 text-slate-900 mt-0.5"/>
        <span class="text-slate-600">I certify that the electrical work has been completed in compliance with university safety standards.</span>
      </label>

      <button type="submit" class="w-full py-3.5 bg-emerald-600 text-white rounded-xl font-bold text-sm hover:bg-emerald-700 shadow-md transition-colors">
        Seal & Complete Job
      </button>
    </form>
  </div>
</div>
