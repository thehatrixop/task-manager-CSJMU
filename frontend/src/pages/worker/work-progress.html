<!-- =========================================================================
     CAMPUSFLOW PAGE COMPONENT: Work Progress Checkpoint Logger
     ID: view-worker-progress
     Location: frontend/src/pages/worker/work-progress.html
     ========================================================================= -->

<div id="view-worker-progress" class="auth-view hidden">
  <div class="max-w-2xl mx-auto">
    <div class="mb-6">
      <button onclick="navigateTo('worker-active', 'worker')" class="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-900 mb-2">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Back to Active Job</span>
      </button>
      <h1 class="text-2xl font-bold text-slate-900">Update Work Progress</h1>
      <p class="text-xs text-slate-600">Submit a status checkpoint visible to complainant and warden</p>
    </div>

    <form onsubmit="handleWorkerProgressSubmit(event)" class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 uppercase mb-1">Current State</label>
        <select id="worker-progress-state" class="w-full h-10 px-3 border border-slate-300 rounded-lg text-sm bg-white">
          <option>Work In Progress</option>
          <option>Awaiting Materials / Spare Parts</option>
          <option>Temporarily Blocked</option>
          <option>Testing & Calibration</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-700 uppercase mb-1">Progress Notes</label>
        <textarea id="worker-progress-note" rows="3" placeholder="e.g. Isolated sub-breaker B2. Replacing scorched 16A terminal lugs..." class="w-full p-3 border border-slate-300 rounded-lg text-sm"></textarea>
      </div>
      <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-xs hover:bg-emerald-600 transition-colors shadow-sm">
        Submit Progress Log
      </button>
    </form>
  </div>
</div>
