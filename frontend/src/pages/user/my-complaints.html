     ID: view-user-complaints
     Location: frontend/src/pages/user/my-complaints.html

<div id="view-user-complaints" class="auth-view hidden">
  <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">My Maintenance Complaints</h1>
      <p class="text-xs text-slate-600">Track and filter all requests submitted from your account</p>
    </div>
    <button onclick="navigateTo('user-report', 'user')" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-emerald-600 transition-colors flex items-center gap-1.5 shadow-sm">
      <span class="material-symbols-outlined text-[16px]">add_circle</span>
      <span>Report Issue</span>
    </button>
  </div>

  <!-- Filters -->
  <div class="bg-white border border-slate-200 rounded-xl p-4 mb-6 shadow-sm flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-2 flex-1 min-w-[200px]">
      <span class="material-symbols-outlined text-[18px] text-slate-400">search</span>
      <input type="text" placeholder="Search by Ticket ID or title..." class="w-full text-xs border-0 focus:outline-none"/>
    </div>
    <div class="flex flex-wrap items-center gap-3 text-xs">
      <select class="px-3 py-1.5 border border-slate-300 rounded-lg bg-white">
        <option>All Departments</option>
        <option>Electrical</option>
        <option>Plumbing</option>
        <option>HVAC</option>
      </select>
      <select class="px-3 py-1.5 border border-slate-300 rounded-lg bg-white">
        <option>All Statuses</option>
        <option>Pending Verification</option>
        <option>In Progress</option>
        <option>Resolved</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-50 border-b border-slate-200 font-mono text-slate-500 uppercase">
        <tr>
          <th class="py-3 px-4">Complaint ID</th>
          <th class="py-3 px-4">Issue Title</th>
          <th class="py-3 px-4">Department</th>
          <th class="py-3 px-4">Location</th>
          <th class="py-3 px-4">Priority</th>
          <th class="py-3 px-4">Current Status</th>
          <th class="py-3 px-4">Last Updated</th>
          <th class="py-3 px-4 text-right">Details</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100" id="user-complaints-full-table">
        <tr class="hover:bg-slate-50">
          <td class="py-3.5 px-4 font-mono font-bold text-slate-900">CF-2026-00124</td>
          <td class="py-3.5 px-4 font-semibold text-slate-900">Switchboard Malfunction</td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 bg-amber-50 text-amber-800 rounded font-mono text-[10px]">Electrical</span></td>
          <td class="py-3.5 px-4 text-slate-600">Block B, Rm 204</td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 bg-red-100 text-red-800 rounded font-mono text-[10px] font-bold">High</span></td>
          <td class="py-3.5 px-4">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md bg-blue-50 text-blue-700 font-mono text-[10px] font-semibold border border-blue-200">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span> Dispatched (Rajesh K.)
            </span>
          </td>
          <td class="py-3.5 px-4 font-mono text-slate-500">12 min ago</td>
          <td class="py-3.5 px-4 text-right">
            <button onclick="navigateTo('user-complaint-details', 'user')" class="px-3 py-1 bg-slate-900 text-white rounded text-[11px] font-semibold hover:bg-emerald-600 transition-colors">
              Inspect
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
